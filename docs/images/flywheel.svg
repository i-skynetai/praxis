<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#16a34a"/>
    </marker>
    <style>
      .app{fill:#f8fafc;stroke:#94a3b8;stroke-width:2.5}
      .seam{fill:#f0f9ff;stroke:#0ea5e9;stroke-width:2.5}
      .tea{fill:#fff7ed;stroke:#ea580c;stroke-width:2.5}
      .stu{fill:#f0fdf4;stroke:#16a34a;stroke-width:2.5}
      .gate{fill:#eef2ff;stroke:#6366f1;stroke-width:2.5}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .h{font-size:22px;fill:#0f172a;font-weight:700}
      .sub{font-size:13px;fill:#475569}
      .t{font-size:14px;fill:#0f172a;font-weight:700}
      .s{font-size:11px;fill:#475569}
      .tag{font-size:11px;fill:#64748b;font-weight:700}
      .mono{font-size:11px;fill:#334155;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .ln{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}
      .dl{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:5 4;marker-end:url(#a)}
      .gl{stroke:#16a34a;stroke-width:2;fill:none;marker-end:url(#b)}
    </style>
  </defs>
  <rect width="1080" height="700" fill="#f8fafc"/>

  <text class="h" x="40" y="46">Praxis — the flywheel, and the number that matters</text>
  <text class="sub" x="40" y="72">The seam sits inside the application, where the types still exist. Not a gateway proxy: a proxy sees bytes, so it cannot judge an answer against a declared type.</text>

  <!-- top row -->
  <rect class="app"  x="40"  y="112" width="160" height="80" rx="10"/>
  <text class="t" x="120" y="144" text-anchor="middle">application</text>
  <text class="s" x="120" y="164" text-anchor="middle">asks for one thing,</text>
  <text class="s" x="120" y="180" text-anchor="middle">gets a typed answer</text>

  <rect class="seam" x="250" y="112" width="220" height="80" rx="10"/>
  <text class="t" x="360" y="140" text-anchor="middle">seam — a capability</text>
  <text class="s" x="360" y="160" text-anchor="middle">an instruction and a declared</text>
  <text class="s" x="360" y="176" text-anchor="middle">output schema. Records a trace.</text>

  <rect class="tea"  x="520" y="112" width="190" height="80" rx="10"/>
  <text class="t" x="615" y="144" text-anchor="middle">teacher</text>
  <text class="s" x="615" y="164" text-anchor="middle">the frontier model,</text>
  <text class="s" x="615" y="180" text-anchor="middle">expensive and good</text>

  <path class="ln" d="M200,152 L246,152"/>
  <path class="ln" d="M470,152 L516,152"/>

  <!-- middle row -->
  <rect class="panel" x="250" y="250" width="160" height="80" rx="10"/>
  <text class="t" x="330" y="282" text-anchor="middle">capture</text>
  <text class="s" x="330" y="302" text-anchor="middle">every call the teacher</text>
  <text class="s" x="330" y="318" text-anchor="middle">answered, as a trace</text>

  <rect class="gate" x="450" y="250" width="190" height="80" rx="10"/>
  <text class="t" x="545" y="278" text-anchor="middle">gate — four checks</text>
  <text class="s" x="545" y="298" text-anchor="middle">right capability · valid schema</text>
  <text class="s" x="545" y="314" text-anchor="middle">not too slow · not a duplicate</text>

  <rect class="stu"  x="760" y="250" width="240" height="80" rx="10"/>
  <text class="t" x="880" y="278" text-anchor="middle">student</text>
  <text class="s" x="880" y="298" text-anchor="middle">anything with <tspan class="mono">fit</tspan> and <tspan class="mono">predict</tspan></text>
  <text class="s" x="880" y="314" text-anchor="middle">returns an output and a confidence</text>

  <path class="ln" d="M360,196 L360,246"/>
  <text class="tag" x="374" y="224">trace</text>
  <path class="ln" d="M410,290 L446,290"/>
  <path class="ln" d="M640,290 L756,290"/>
  <text class="tag" x="698" y="278" text-anchor="middle">accepted traces only</text>

  <!-- router -->
  <rect x="250" y="384" width="750" height="94" rx="12" fill="#fff" stroke="#0f172a" stroke-width="2.5"/>
  <text class="t" x="625" y="416" text-anchor="middle">router — student above the threshold, teacher below it</text>
  <text class="s" x="625" y="440" text-anchor="middle">And it falls back when the student is confident <tspan font-style="italic">and</tspan> malformed, because a well-formed schema is the only check</text>
  <text class="s" x="625" y="458" text-anchor="middle">available at answer time. Confidence alone is the model's own opinion of itself.</text>

  <path class="gl" d="M880,334 L880,380"/>
  <path class="dl" d="M710,152 L1044,152 L1044,366 L960,366 L960,380"/>
  <text class="tag" x="1040" y="356" text-anchor="end">the teacher stays reachable</text>

  <path class="ln" d="M250,431 L120,431 L120,198"/>
  <text class="tag" x="134" y="330">the answer,</text>
  <text class="tag" x="134" y="346">from whichever</text>
  <text class="tag" x="134" y="362">one was asked</text>

  <!-- the metric -->
  <rect class="panel" x="40" y="512" width="1000" height="150" rx="12"/>
  <text class="t" x="62" y="544">The number that matters</text>
  <text class="s" x="62" y="566">Deflection alone is a vanity metric. A student that defers is merely useless. A student that answers wrongly with high confidence is worse</text>
  <text class="s" x="62" y="582">than no student at all — and deflection hides exactly that. So <tspan class="mono">evaluate()</tspan> reports confident-wrong as a column of its own.</text>
  <text class="mono" x="62" y="614" xml:space="preserve">student                 deflect  accuracy  conf-wrong  deferred</text>
  <text class="mono" x="62" y="630" xml:space="preserve">------------------------------------------------------------------</text>
  <text class="mono" x="62" y="646" xml:space="preserve">nearest-neighbour         0.500     1.000       0.000         1</text>
</svg>
