name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The runtime is standard library only, so the test job has no install step, no
    # lockfile, nothing to drift. If a Python version the README claims support for
    # stops working, this is where it shows.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests -t . -v
      - name: Run the demo with nothing installed
        run: python -m praxis demo --tickets 30

  typecheck:
    # mypy --strict on praxis/core, praxis/providers and the CLI. mypy is a development
    # dependency only; nothing at runtime needs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: python -m pip install --quiet "mypy>=1.10"
      - name: mypy --strict
        run: python -m mypy
